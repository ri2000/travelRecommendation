<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Travel Bloom</title>
        <link rel="stylesheet" href="./contact_us.css">
    </head>
    <body>
        <navbar>
            <ul>
                <li>
                    <div id="logo-container">
                        <img id="logo" src="Airplane-Logo-Design.jpg">
                        <h1>TravelBloom</h1>
                    </div>
                </li>
                <li id="links"><a href="./index.html">Home</a>
                    <a href="./about_us.html">About Us</a>
                    <a href="./contact_us.html">Contact Us</a></li>
                <li></li>
            </ul>
        </navbar>
        <main>
            <div id="background">
                <div id="content">
                    <div id="logos-media">
                        <img class="media" src="X-logo.png">
                        <img class="media" src="YouTube-Logo.png">
                        <img class="media" src="facebook-logo.jpg">
                        <img class="media" src="instagram-logo.png">
                    </div>
                    <div id="information">
                        <div id="about_us">
                            <h1><strong>CONTACT US</strong></h1><br>
                            <p>Get in touch.</p><br>
                        </div>
                        <div id="form">
                            <label for="name" class="label">Name</label>
                            <input type="text" placeholder="Enter your name">
                            <label for="email" class="label">Email</label>
                            <input type="text" placeholder="Enter your email">
                            <label for="message" class="label">Message</label>
                            <textarea id="message" rows="5" placeholder="Enter your message"></textarea>
                            <button type="submit" id="sub_btn">Submit</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
